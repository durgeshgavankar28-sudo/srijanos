<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SrijanOS - CEO Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white font-sans antialiased">
    <div class="container mx-auto p-10 max-w-5xl">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-emerald-400">CEO Analytics Command Center</h1>
                <p class="text-slate-400 mt-2">Live traffic monitoring for SrijanOS</p>
            </div>
            <button onclick="fetchStats()" class="bg-blue-600 hover:bg-blue-700 px-6 py-2 rounded-lg font-bold transition shadow-lg flex items-center">
                <i class="fa-solid fa-rotate mr-2"></i> Refresh Live Data
            </button>
        </div>

        <!-- KPI Cards -->
        <div class="grid grid-cols-1 md:grid-cols-5 gap-6 mb-10">
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-400 font-bold mb-2 uppercase text-xs tracking-wider">Registered Users</div>
                <div id="registeredUsers" class="text-5xl font-black text-blue-500">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-400 font-bold mb-2 uppercase text-xs tracking-wider">AI Plans Saved</div>
                <div id="totalPlans" class="text-5xl font-black text-purple-400">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-400 font-bold mb-2 uppercase text-xs tracking-wider">Total Unique Views</div>
                <div id="totalViews" class="text-5xl font-black text-white">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-400 font-bold mb-2 uppercase text-xs tracking-wider">Landing Page Hits</div>
                <div id="landingHits" class="text-5xl font-black text-emerald-400">0</div>
            </div>
            <div class="bg-slate-800 border border-slate-700 p-6 rounded-2xl shadow-xl">
                <div class="text-slate-400 font-bold mb-2 uppercase text-xs tracking-wider">App Dashboard Hits</div>
                <div id="dashboardHits" class="text-5xl font-black text-blue-400">0</div>
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-10">
            <!-- Live Feed -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-slate-850 p-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-satellite-dish mr-2 text-emerald-500"></i> Live Visitor Feed</h3>
                    <span class="text-xs text-slate-500 font-mono" id="lastUpdated">Updating...</span>
                </div>
                <div class="p-0">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-slate-400 text-sm uppercase tracking-wider">
                                <th class="p-4 border-b border-slate-700">Time</th>
                                <th class="p-4 border-b border-slate-700">Path</th>
                            </tr>
                        </thead>
                        <tbody id="feedTable" class="text-sm font-mono text-slate-300">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Recent Signups -->
            <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-xl overflow-hidden">
                <div class="bg-slate-850 p-4 border-b border-slate-700 flex justify-between items-center">
                    <h3 class="font-bold text-lg"><i class="fa-solid fa-users mr-2 text-purple-500"></i> Newest Users</h3>
                </div>
                <div class="p-0">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-slate-400 text-sm uppercase tracking-wider">
                                <th class="p-4 border-b border-slate-700">Email</th>
                            </tr>
                        </thead>
                        <tbody id="usersTable" class="text-sm font-mono text-slate-300">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const res = await fetch('/api/admin/stats');
                const data = await res.json();
                
                document.getElementById('totalViews').innerText = data.total_visits || 0;
                document.getElementById('landingHits').innerText = (data.paths && data.paths['/index.html']) ? data.paths['/index.html'] : 0;
                document.getElementById('dashboardHits').innerText = (data.paths && data.paths['/dashboard.html']) ? data.paths['/dashboard.html'] : 0;
                
                if (data.registeredUsers !== undefined) {
                    document.getElementById('registeredUsers').innerText = data.registeredUsers;
                    document.getElementById('totalPlans').innerText = data.totalSavedPlans;
                }

                const feed = document.getElementById('feedTable');
                feed.innerHTML = '';
                
                if (data.last_visits && data.last_visits.length > 0) {
                    data.last_visits.forEach(v => {
                        const date = new Date(v.time).toLocaleTimeString();
                        feed.innerHTML += `
                            <tr class="hover:bg-slate-700 transition border-b border-slate-700/50">
                                <td class="p-4 whitespace-nowrap text-emerald-400">${date}</td>
                                <td class="p-4 text-blue-300">${v.path}</td>
                            </tr>
                        `;
                    });
                } else {
                    feed.innerHTML = `<tr><td colspan="2" class="p-8 text-center text-slate-500 italic">No recent visitors. Awaiting Reddit traffic...</td></tr>`;
                }

                const usersTable = document.getElementById('usersTable');
                if (data.recentSignups && data.recentSignups.length > 0) {
                    usersTable.innerHTML = data.recentSignups.map(u => `
                        <tr class="hover:bg-slate-700 transition border-b border-slate-700/50">
                            <td class="p-4 font-medium text-white">${u.email}</td>
                        </tr>
                    `).join('');
                } else {
                    usersTable.innerHTML = '<tr><td class="p-8 text-center text-slate-500 italic">No users yet.</td></tr>';
                }

                document.getElementById('lastUpdated').innerText = 'Last updated: ' + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Failed to load stats", err);
            }
        }

        fetchStats();
        setInterval(fetchStats, 5000);
    </script>
</body>
</html>
